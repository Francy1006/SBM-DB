sonar.projectKey=SBM-DB
sonar.projectName=SBM-DB
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Community Build scope for this database repository.
# PostgreSQL/Flyway SQL is intentionally excluded because PL/SQL analysis is not
# part of the free Community Build gate.
sonar.sources=scripts,docker-compose.yml
sonar.exclusions=**/.git/**,**/.sonar/**,**/.scannerwork/**,**/context/**,**/flyway/**,**/dbdiagram/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

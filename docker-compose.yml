version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_sbm_vol:/var/lib/postgresql/data
    networks:
      - sbm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway_sbm_business:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
    command: -configFiles=/flyway/conf/flyway.conf migrate
    volumes:
      - ./flyway/sql/sbm_business:/flyway/sql
      - ./flyway/sql/sbm_business/flyway.conf:/flyway/conf/flyway.conf
    env_file:
      - .env
    networks:
      - sbm-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "flyway", "-configFiles=/flyway/conf/flyway.conf", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  flyway_ditaly_pasta:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
      flyway_sbm_business:
        condition: service_completed_successfully
    command: -configFiles=/flyway/conf/flyway.conf migrate
    volumes:
      - ./flyway/sql/ditaly_pasta:/flyway/sql
      - ./flyway/sql/ditaly_pasta/flyway.conf:/flyway/conf/flyway.conf
    env_file:
      - .env
    networks:
      - sbm-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "flyway", "-configFiles=/flyway/conf/flyway.conf", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  flyway_cross:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
      flyway_sbm_business:
        condition: service_completed_successfully
      flyway_ditaly_pasta:
        condition: service_completed_successfully
    command: -configFiles=/flyway/conf/flyway.conf migrate
    volumes:
      - ./flyway/sql/cross:/flyway/sql
      - ./flyway/sql/cross/flyway.conf:/flyway/conf/flyway.conf
    env_file:
      - .env
    networks:
      - sbm-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "flyway", "-configFiles=/flyway/conf/flyway.conf", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  flyway_analytics:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
      flyway_sbm_business:
        condition: service_completed_successfully
      flyway_ditaly_pasta:
        condition: service_completed_successfully
      flyway_cross:
        condition: service_completed_successfully
    command: -configFiles=/flyway/conf/flyway.conf migrate
    volumes:
      - ./flyway/sql/analytics:/flyway/sql
      - ./flyway/sql/analytics/flyway.conf:/flyway/conf/flyway.conf
    env_file:
      - .env
    networks:
      - sbm-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "flyway", "-configFiles=/flyway/conf/flyway.conf", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_sbm_vol:

networks:
  sbm-network:
    external: true

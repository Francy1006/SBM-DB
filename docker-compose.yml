version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sbm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbm_password}
      POSTGRES_DB: ${POSTGRES_DB:-sbm_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_sbm_vol:/var/lib/postgresql/data
    networks:
      - sbm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbm_user} -d ${POSTGRES_DB:-sbm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway_sbm_business:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
    command: -configFiles=/flyway/conf/flyway.conf migrate
    volumes:
      - ./flyway/sql/sbm_business:/flyway/sql
      - ./flyway/sql/sbm_business/flyway.conf:/flyway/conf/flyway.conf
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-sbm_db}
      POSTGRES_USER: ${POSTGRES_USER:-sbm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbm_password}
    networks:
      - sbm-network

  flyway_ditaly_pasta:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
    command: -configFiles=/flyway/conf/flyway.conf migrate
    volumes:
      - ./flyway/sql/ditaly_pasta:/flyway/sql
      - ./flyway/sql/ditaly_pasta/flyway.conf:/flyway/conf/flyway.conf
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-sbm_db}
      POSTGRES_USER: ${POSTGRES_USER:-sbm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbm_password}
    networks:
      - sbm-network

volumes:
  postgres_sbm_vol:

networks:
  sbm-network:
    driver: bridge